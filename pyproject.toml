[project]
name = "paper-radar"
version = "0.1.0"
description = "arXiv 신규 논문 자동 수집·요약·랭킹 데일리 다이제스트 (논문 레이더)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=2.1",
    "anthropic>=0.68",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
paper-radar = "paper_radar.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
